# LeVerbe for Android, aimed at e-ink tablets: the desktop app's library, run
# by an Android activity, with the Bible database shipped in the APK.
#
# Build with cargo-apk (see android/README.md):
#   tools/android-db.sh && cargo apk build -p leverbe-android --release
[package]
name = "leverbe-android"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
logos-rs = { path = ".." }
slint = { version = "1.18", features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "android")'.dependencies]
# the one android-activity 0.6 hands out (the APK's assets)
ndk = "0.9"

[package.metadata.android]
package = "io.github.rmpr.leverbe"
apk_name = "LeVerbe"
# 64-bit ARM: every current e-ink tablet (Boox, Bigme, Meebook…)
build_targets = ["aarch64-linux-android"]
# bible.db, put there by tools/android-db.sh
assets = "assets"
resources = "res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "LeVerbe"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# Turning the tablet or folding its keyboard resizes the window instead of
# restarting the app, which would reopen the database and lose the place.
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
