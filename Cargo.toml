[package]
name = "logos-rs"
version = "0.3.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
flate2 = "1.1.9"
pdf-extract = "0.12"
regex = "1.12.4"
rfd = "0.17"
roxmltree = "0.21.1"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slint = "1.18"
unicode-normalization = "0.1.25"
ureq = "3.3.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18"

[lib]
name = "logos_rs"
path = "src/lib.rs"

[[bin]]
name = "logos-rs"
path = "src/main.rs"

[[bin]]
name = "import"
path = "src/bin/import.rs"

# Optimize dependencies (bundled SQLite, slint) even in dev for snappy iteration
[profile.dev.package."*"]
opt-level = 2
