<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3366e6"/>
      <stop offset="1" stop-color="#16296b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#fde68a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f3ead6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6dbc0"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- the light -->
  <circle cx="128" cy="84" r="64" fill="url(#glow)"/>
  <path d="M128 42 Q132.5 79.5 166 84 Q132.5 88.5 128 126 Q123.5 88.5 90 84 Q123.5 79.5 128 42 Z" fill="#fde68a"/>
