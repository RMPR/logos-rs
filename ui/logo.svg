  <path d="M128 138 C150 122 180 118 210 124 V202 C180 196 150 200 128 214 Z" fill="url(#right)"/>
  <!-- lines of text, only seen at large sizes -->
  <g fill="none" stroke="#c9bb98" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M60 144 C80 140 98 142 114 150"/><path d="M60 160 C80 156 98 158 114 166"/><path d="M60 176 C80 172 98 174 114 182"/>
    <path d="M142 150 C158 142 176 140 196 144"/><path d="M142 166 C158 158 176 156 196 160"/><path d="M142 182 C158 174 176 172 196 176"/>
  </g>
  <path d="M128 138 V214" stroke="#16296b" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
